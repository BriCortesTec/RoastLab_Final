# Copiar a /etc/nginx/sites-available/roastlab y enlazar a sites-enabled.
# Certbot agregará después el bloque HTTPS (443) y la redirección automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name roastlab.space www.roastlab.space;

    root /var/www/roastlab;
    index index.html;

    # API: Nginx reenvia /api al backend Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend React (build estatico). Las rutas de React caen en index.html
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
