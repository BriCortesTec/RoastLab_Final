# Configuracion comun (SIN secretos). Los secretos van en:
#   application-local.properties  (desarrollo, NO se sube a git)
#   application-prod.properties   (VPS, NO se sube a git)
# Ver application.properties.example

spring.application.name=backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/roastlab_final?serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Evita el problema N+1 al leer colecciones LAZY (carga por lotes)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Vigencia del token en milisegundos (2 horas)
app.jwt.expiration=7200000
app.cors.allowed-origins=http://localhost:5173
app.frontend-url=http://localhost:5173

# Correo (Postfix local en el VPS)
app.mail.from=no-reply@roastlab.space
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
